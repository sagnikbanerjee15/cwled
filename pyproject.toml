[build-system]
requires = ["setuptools>=61.0.0", "wheel","ruamel-base","ruamel.yaml"]
build-backend = "setuptools.build_meta"

[project]
name = "cwled"
version = "0.1.10"
description = "A graphical editor for Common Workflow Language (CWL) documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Konstantinos Mavrommatis" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt6>=6.7.1",
    "PyQt6-QScintilla>=2.14.1",
    "QtPy>=2.4.1",
    "ruamel.yaml>=0.18.6",
    "ruamel.yaml.clib>=0.2.8",
    "ruamel.yaml.string>=0.1.1",
    "cwl-utils>=0.34",
    "schema-salad>=8.7.20240905150001",
    "cwltool>=3.1.20240909164951",
    "cwlformat>=2022.2.18",
    "colorlog>=6.9.0",
    "markdown2>=2.5.0",
    "nested-lookup>=0.2.25",
    "Jinja2>=3.1.4",
    "watchdog>=6.0.0",
    "python-dotenv>=1.1.1",
    "platformdirs>=4.4.0",
    "langchain>=1.2.7",
    "langchain-anthropic>=1.3.1",
    "langchain-core>=1.2.7",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.7",
    "requests>=2.32.3",
    "GitPython>=3.1.45",
    "pydantic>=2.11.9",
    "h5py>=3.11.0",
    "guidata>=3.1.0",
    "odengraphqt>=0.7.4",
    "sbpack>=2024.12.17",
    "markdownify>=1.2.3",
    "markdown>=3.10.3",
]

[project.scripts]
cwled = "cwled:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "py2app>=0.28",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# GUI tests: they run on Qt's offscreen platform (see pytests/conftest.py).
# The CWL documents in tests/ are only the fixtures they open: tests/ holds no test code.
testpaths = ["pytests"]
pythonpath = ["cwled"]
python_files = ["test_*.py"]
# a test that hangs (for example on a dialog that waits for someone) prints where it is after this many seconds
faulthandler_timeout = 120
addopts = "--show-capture=no --tb=short"

[tool.uv.sources]
# PyQt6 fork: upstream create_node() has no width/height/text_alignment kwargs
odengraphqt = { git = "https://github.com/kmavrommatis/OdenGraphQt.git", branch = "PyQT6" }
