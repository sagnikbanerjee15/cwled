name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: GUI tests (offscreen)
    runs-on: ubuntu-latest
    env:
      # the tests drive the application without a display (see pytests/conftest.py)
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true

      - name: Install the system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the tests
        run: uv run pytest
